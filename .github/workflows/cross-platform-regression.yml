name: Cross-platform regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scripts:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Check local control plane and public routing schema
        run: |
          python .agents/skills/external-agent-collaboration/scripts/bootstrap.py --init
          python .agents/skills/external-agent-collaboration/scripts/bootstrap.py --check
          python .agents/skills/external-agent-collaboration/scripts/doctor.py --routing --json

      - name: Run dependency-free regression suite
        run: python .agents/skills/external-agent-collaboration/scripts/run_regression.py

      - name: Run source and privacy quality gate
        run: python .agents/skills/external-agent-collaboration/scripts/quality_gate.py --privacy

      - name: Check Git whitespace
        run: git diff --check
